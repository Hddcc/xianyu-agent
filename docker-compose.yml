services:
  xianyu-agent:
    build: .
    container_name: xianyu-agent
    restart: always
    env_file: .env
    ports:
      - "${COOKIE_SYNC_BIND_HOST:-127.0.0.1}:${COOKIE_SYNC_PORT:-8765}:${COOKIE_SYNC_PORT:-8765}"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
